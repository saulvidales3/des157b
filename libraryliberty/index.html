<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cityscape</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
<body>
  <a-scene>

    <!-- SKY -->
    <a-sky color="#1a1a2e"></a-sky>

    <!-- GROUND / ROAD -->
    <a-plane position="0 0 -6" rotation="-90 0 0" width="20" height="20" color="#2a2a2a"></a-plane>
    <!-- Road marking -->
    <a-box position="0 0.01 -6" width="0.2" height="0.01" depth="10" color="#FFFF00"></a-box>

    <!-- ===== BUILDING 1 - Tall skyscraper (left) ===== -->
    <a-box position="-4 4 -8" width="2" height="8" depth="2" color="#445566"></a-box>
    <!-- Windows: 4 columns x 6 rows on front face -->
    <a-box position="-4.6 6.5 -6.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="-4.2 6.5 -6.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="-3.8 6.5 -6.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="-3.4 6.5 -6.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>

    <a-box position="-4.6 5.5 -6.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="-4.2 5.5 -6.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="-3.8 5.5 -6.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="-3.4 5.5 -6.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>

    <a-box position="-4.6 4.5 -6.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="-4.2 4.5 -6.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="-3.8 4.5 -6.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="-3.4 4.5 -6.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>

    <a-box position="-4.6 3.5 -6.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="-4.2 3.5 -6.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="-3.8 3.5 -6.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="-3.4 3.5 -6.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>

    <a-box position="-4.6 2.5 -6.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="-4.2 2.5 -6.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="-3.8 2.5 -6.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="-3.4 2.5 -6.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>

    <a-box position="-4.6 1.5 -6.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="-4.2 1.5 -6.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="-3.8 1.5 -6.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="-3.4 1.5 -6.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>

    <!-- ===== BUILDING 2 - Medium (center-left) ===== -->
    <a-box position="-1.5 2 -7" width="2" height="4" depth="2" color="#556677"></a-box>
    <!-- Windows: 3 columns x 3 rows -->
    <a-box position="-2.1 3.2 -5.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="-1.5 3.2 -5.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="-0.9 3.2 -5.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>

    <a-box position="-2.1 2.2 -5.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="-1.5 2.2 -5.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="-0.9 2.2 -5.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>

    <a-box position="-2.1 1.2 -5.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="-1.5 1.2 -5.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="-0.9 1.2 -5.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>

    <!-- ===== BUILDING 3 - Wide office block (center-right) ===== -->
    <a-box position="2 3 -8" width="3" height="6" depth="2" color="#334455"></a-box>
    <!-- Windows: 4 columns x 4 rows -->
    <a-box position="0.8 5.0 -6.95" width="0.3" height="0.3" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="1.6 5.0 -6.95" width="0.3" height="0.3" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="2.4 5.0 -6.95" width="0.3" height="0.3" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="3.2 5.0 -6.95" width="0.3" height="0.3" depth="0.01" color="#FFFF99"></a-box>

    <a-box position="0.8 3.8 -6.95" width="0.3" height="0.3" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="1.6 3.8 -6.95" width="0.3" height="0.3" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="2.4 3.8 -6.95" width="0.3" height="0.3" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="3.2 3.8 -6.95" width="0.3" height="0.3" depth="0.01" color="#FFFF99"></a-box>

    <a-box position="0.8 2.6 -6.95" width="0.3" height="0.3" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="1.6 2.6 -6.95" width="0.3" height="0.3" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="2.4 2.6 -6.95" width="0.3" height="0.3" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="3.2 2.6 -6.95" width="0.3" height="0.3" depth="0.01" color="#FFFF99"></a-box>

    <a-box position="0.8 1.4 -6.95" width="0.3" height="0.3" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="1.6 1.4 -6.95" width="0.3" height="0.3" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="2.4 1.4 -6.95" width="0.3" height="0.3" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="3.2 1.4 -6.95" width="0.3" height="0.3" depth="0.01" color="#FFFF99"></a-box>

    <!-- ===== BUILDING 4 - Short (right) ===== -->
    <a-box position="4.5 1.5 -7" width="2" height="3" depth="2" color="#667788"></a-box>
    <!-- Windows: 3 columns x 2 rows -->
    <a-box position="3.7 2.5 -5.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="4.5 2.5 -5.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="5.3 2.5 -5.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>

    <a-box position="3.7 1.3 -5.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="4.5 1.3 -5.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>
    <a-box position="5.3 1.3 -5.95" width="0.25" height="0.25" depth="0.01" color="#FFFF99"></a-box>

    <!-- STREETLIGHT -->
    <a-cylinder position="-2 1 -5" radius="0.05" height="2" color="#888888"></a-cylinder>
    <a-sphere position="-2 2.1 -5" radius="0.1" color="#FFFF99"></a-sphere>

    <!-- MOON -->
    <a-sphere position="3 6 -12" radius="0.6" color="#DDDDCC"></a-sphere>

  </a-scene>

  
</body>
</html>
